http_port 3128
visible_hostname harness-lab-proxy

acl SSL_ports port 443
acl CONNECT method CONNECT

# Provider and login destinations required by the controlled model runs.
acl provider_domains dstdomain \
  .anthropic.com \
  .claude.ai \
  .openai.com \
  .chatgpt.com \
  .pi.dev

http_access deny CONNECT !SSL_ports
http_access allow provider_domains
http_access deny all

cache deny all
access_log stdio:/var/log/squid/access.log
cache_log stdio:/var/log/squid/cache.log
pid_filename none
